---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Vet, test, cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No third-party modules, so there is no go.sum to cache from.
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # checkdrive only talks to raw devices on macOS, so the build that
      # matters is the cross-build. It has no dependencies outside the
      # standard library, which is what makes this possible on a Linux runner.
      - name: Cross-build for macOS
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" go vet ./...
            GOOS=darwin GOARCH="$arch" go build -o /dev/null .
          done
